## Color palette - OneDark
# bg           "#282C34"
# bg_dark      "#21252B"
# bg_highlight "#2C323C"
# fg           "#ABB2BF"
# comment      "#5C6370"
# cyan         "#56B6C2"
# blue         "#61AFEF"
# purple       "#C678DD"
# green        "#98C379"
# red          "#E06C75"
# yellow       "#E5C07B"
# orange       "#D19A66"

[manager]
marker_copied = { fg = "#98C379", bg = "#98C379" }
marker_cut = { fg = "#E06C75", bg = "#E06C75" }
marker_marked = { fg = "#C678DD", bg = "#C678DD" }
marker_selected = { fg = "#E06C75", bg = "#E06C75" }
cwd = { fg = "#E5C07B" }
hovered = { reversed = true }
preview_hovered = { reversed = true }
find_keyword = { fg = "#E06C75", bg = "#282C34" }
find_position = {}
count_copied = { fg = "#282C34", bg = "#98C379" }
count_cut = { fg = "#282C34", bg = "#E06C75" }
count_selected = { fg = "#282C34", bg = "#E5C07B" }
border_symbol = "│"
border_style = { fg = "#ABB2BF" }

[tabs]
active = { reversed = true }
inactive = {}
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#282C34", bg = "#61AFEF" }
normal_alt = { fg = "#61AFEF", bg = "#21252B" }
select_main = { fg = "#282C34", bg = "#C678DD" }
select_alt = { fg = "#C678DD", bg = "#21252B" }
unset_main = { fg = "#282C34", bg = "#E5C07B" }
unset_alt = { fg = "#E5C07B", bg = "#21252B" }

[indicator]
padding = { open = "█", close = "█" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#ABB2BF", bg = "#191919" }
progress_label = { fg = "#61AFEF", bg = "#21252B", bold = true }
progress_normal = { fg = "#21252B", bg = "#282C34" }
progress_error = { fg = "#21252B", bg = "#282C34" }
perm_type = { fg = "#98C379" }
perm_read = { fg = "#E5C07B" }
perm_write = { fg = "#E06C75" }
perm_exec = { fg = "#56B6C2" }
perm_sep = { fg = "#C678DD" }

[pick]
border = { fg = "#61AFEF" }
active = { fg = "#C678DD", bold = true }
inactive = {}

[input]
border = { fg = "#61AFEF" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#61AFEF" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "#61AFEF" }
title = {}
hovered = { fg = "#C678DD" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#5C6370" }
mask = { bg = "#21252B" }
rest = { fg = "#5C6370" }
cand = { fg = "#61AFEF" }
desc = { fg = "#5C6370" }

[help]
on = { fg = "#56B6C2" }
run = { fg = "#C678DD" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#282C34", bg = "#ABB2BF" }

[notify]
title_info = { fg = "#98C379" }
title_warn = { fg = "#E5C07B" }
title_error = { fg = "#E06C75" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "#E5C07B" },
    # media
    { mime = "{audio,video}/*", fg = "#C678DD" },
    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E06C75" },
    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#56B6C2" },
    # broken links
    { name = "*", is = "orphan", fg = "#E06C75" },
    # executables
    { name = "*", is = "exec", fg = "#98C379" },
    # fallback
    { name = "*", fg = "#ABB2BF" },
    { name = "*/", fg = "#61AFEF" },
]
